  <path d="M265 150 Q265 112 303 112 H497 Q535 112 535 150 V440 Q535 466 509 466 H291 Q265 466 265 440 Z" fill="#2c3330"/>
  <path d="M283 140 Q283 128 297 128 H503 Q517 128 517 140 V160 H283 Z" fill="#3d4642"/>

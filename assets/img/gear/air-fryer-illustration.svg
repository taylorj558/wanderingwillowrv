  <circle cx="400" cy="300" r="230" fill="#e6dcc8"/>
  <!-- counter -->
  <rect x="120" y="470" width="560" height="18" rx="9" fill="#cbbd9f"/>
  <ellipse cx="400" cy="468" rx="170" ry="14" fill="#000" opacity=".12"/>

  <circle cx="345" cy="258" r="9" fill="#58625d"/><circle cx="375" cy="258" r="9" fill="#58625d"/>
  <circle cx="425" cy="258" r="9" fill="#58625d"/><circle cx="455" cy="258" r="9" fill="#f08a4b"/>

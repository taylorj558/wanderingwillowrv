</div><script>
// Helper: lets the site owner's Pinterest tab request these public pin images.
window.addEventListener('message', async (e) => {
  if (e.origin !== 'https://www.pinterest.com') return;
  const f = String(e.data && e.data.file || '');
  if (!/^pin-[a-z0-9-]+\.jpg$/.test(f)) return;
  const buf = await (await fetch('assets/img/pins/' + f)).arrayBuffer();
  e.source.postMessage({ file: f, buf: buf }, e.origin, [buf]);
});
if (window.opener) window.opener.postMessage({ ready: true }, 'https://www.pinterest.com');
</script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Wandering Willow RV</title>
  <meta name="description" content="Send James and Mallory a question, a campground tip, or your own storm-prep story.">
  <link rel="canonical" href="https://www.wanderingwillowrv.com/contact.html">
  <!-- Social share preview (shows when the link is posted on Facebook, texts, etc.) -->
  <meta property="og:title" content="Contact">
  <meta property="og:description" content="Send James and Mallory a question, a campground tip, or your own storm-prep story.">
  <meta property="og:image" content="https://www.wanderingwillowrv.com/assets/img/share-card.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="assets/css/style.css?v=20261113">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div id="global-header"></div>

<main id="main">
<section class="page-hero">
  <div class="wrap split" style="align-items:start">
    <div>
      <span class="eyebrow">Let's talk</span>
      <h1>Say hi.</h1>
      <p class="lead">Questions about our gear, a campground we should try, your own storm-prep story, or a brand that wants to work together — we read every message.</p>
      <p>Prefer social? Find us on YouTube, Instagram, Facebook, and TikTok (links in the footer).</p>
    </div>
    <div class="card" style="padding:28px">
      <!--
        GitHub Pages can't process forms by itself. This form posts to Formspree (free tier is fine).
        1. Sign up at formspree.io and create a form.
        2. Replace YOUR_FORM_ID below with the ID it gives you.
      -->
      <form class="form" action="https://formspree.io/f/xjyywzkw" method="POST">
        <div class="form-row">
          <div><label for="fn">First name</label><input id="fn" name="first_name" autocomplete="given-name"></div>
          <div><label for="ln">Last name</label><input id="ln" name="last_name" autocomplete="family-name"></div>
        </div>
        <div><label for="em">Email *</label><input id="em" name="email" type="email" required autocomplete="email"></div>
        <div>
          <label for="topic">What's this about?</label>
          <select id="topic" name="topic">
            <option>A question for us</option>
            <option>A campground tip</option>
            <option>My own RV story</option>
            <option>Brand partnership</option>
            <option>Something else</option>
          </select>
        </div>
        <div><label for="msg">Message</label><textarea id="msg" name="message" required></textarea></div>
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <button class="btn btn-primary" type="submit">Send message</button>
      </form>
    </div>
  </div>
</section>

</main>

<div id="global-footer"></div>
<script src="/assets/js/main.js?v=20261113"></script>
</body>
</html>
